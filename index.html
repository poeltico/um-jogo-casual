<style>
/* Layout: uma coluna estreita de celular; cada tela é um "palco" com barra de dica no topo e ação principal embaixo. */
:root {
  --bg: #F3F2FA;
  --surface: #FFFFFF;
  --ink: #1D1B3A;
  --muted: #64628A;
  --line: #DEDCEE;
  --accent: #E8336D;
  --accent-ink: #FFFFFF;
  --accent-soft: #FDE2EB;
  --warn: #F5B700;
  --warn-soft: #FFF3C9;
  --ok: #129A6B;
  --ok-soft: #DDF4EA;
  --stripe-1: #E3F4F4;
  --stripe-2: #E8EEFC;
  --stripe-3: #EFEAFC;
  --t-coral: #F0544F;
  --t-mar: #0E9C9C;
  --t-sol: #D99A00;
  --t-uva: #6C5AD0;
  --t-lima: #4E9A22;
  --t-ceu: #2A86E0;
  --display: "Bagel Fat One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141329; --surface: #1F1D3B; --ink: #F1F0FF; --muted: #A6A4CA; --line: #34315B;
    --accent: #FF5C8E; --accent-ink: #1A0710; --accent-soft: #4A1D31;
    --warn: #FFCC3D; --warn-soft: #4A3A08; --ok: #3CCB95; --ok-soft: #123A2C;
    --stripe-1: #173638; --stripe-2: #1C2847; --stripe-3: #2A2350;
    --t-coral: #FF7A74; --t-mar: #2FC4C4; --t-sol: #F2B92E; --t-uva: #9C8CFF; --t-lima: #7BC74A; --t-ceu: #5AA8F5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141329; --surface: #1F1D3B; --ink: #F1F0FF; --muted: #A6A4CA; --line: #34315B;
  --accent: #FF5C8E; --accent-ink: #1A0710; --accent-soft: #4A1D31;
  --warn: #FFCC3D; --warn-soft: #4A3A08; --ok: #3CCB95; --ok-soft: #123A2C;
  --stripe-1: #173638; --stripe-2: #1C2847; --stripe-3: #2A2350;
  --t-coral: #FF7A74; --t-mar: #2FC4C4; --t-sol: #F2B92E; --t-uva: #9C8CFF; --t-lima: #7BC74A; --t-ceu: #5AA8F5;
  color-scheme: dark;
}
html, body { height: 100%; overscroll-behavior-y: none; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 540px; margin: 0 auto; padding-block: 12px 32px; display: flex; flex-direction: column; gap: 16px; min-height: 100%; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
input, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; box-sizing: border-box; }
textarea { resize: vertical; min-height: 48px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--muted); }

/* Botões */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 20px; border-radius: 16px; font-weight: 700; font-size: 17px; width: 100%; box-sizing: border-box; transition: transform .08s ease; }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: var(--surface); border: 1.5px solid var(--line); }
.btn-ok { background: var(--ok); color: #fff; }
.btn-warn { background: var(--warn-soft); color: var(--ink); border: 1.5px solid var(--warn); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* Barra superior */
.topbar { display: flex; align-items: center; gap: 8px; }
.topbar .brand { font-family: var(--display); font-size: 22px; flex: 1; min-width: 0; color: var(--accent); }
.text-btn { height: 44px; padding: 0 12px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); font-weight: 700; font-size: 14px; flex: none; white-space: nowrap; }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: 18px; flex: none; }
.tip { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 14px; font-size: 15px; display: flex; gap: 10px; align-items: flex-start; }
.tip b { color: var(--accent); }
.tip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-top: 7px; flex: none; }

/* Menu */
.hello h1 { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1.05; }
.game-card { background: var(--surface); border-radius: 22px; border: 1.5px solid var(--line); overflow: hidden; }
.game-head { display: flex; gap: 14px; align-items: center; padding: 16px; width: 100%; text-align: left; }
.logo { width: 64px; height: 64px; border-radius: 18px; background: var(--accent); display: grid; place-items: center; flex: none; }
.logo svg { width: 44px; height: 44px; }
.game-head h2 { font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1; }
.game-head .chev { margin-left: auto; font-size: 20px; transition: transform .2s; }
.game-card.open .chev { transform: rotate(180deg); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px 16px; }
.fact { background: var(--bg); border-radius: 14px; padding: 10px 12px; }
.fact .v { font-weight: 700; }
.fact.wide { grid-column: 1 / -1; }
.game-actions { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.soon { border: 1.5px dashed var(--line); border-radius: 22px; padding: 16px; color: var(--muted); }
.resume { background: var(--accent-soft); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }

/* Preparação */
.section { display: flex; flex-direction: column; gap: 10px; }
.modes { display: flex; flex-direction: column; gap: 8px; }
.mode { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; }
.mode .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); flex: none; margin-top: 2px; display: grid; place-items: center; }
.mode.on { border-color: var(--accent); }
.mode.on .radio { border-color: var(--accent); }
.mode.on .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.mode b { display: block; }
.team { background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 8px; border-left: 8px solid var(--tc); }
.team-top { display: flex; gap: 8px; align-items: center; }
.team-top input { font-weight: 700; }
.swatch { width: 14px; height: 14px; border-radius: 50%; background: var(--tc); flex: none; }
.notice { background: var(--warn-soft); border: 1.5px solid var(--warn); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.error { background: var(--accent-soft); border-radius: 14px; padding: 12px 14px; font-weight: 500; }
.pack { display: flex; justify-content: space-between; gap: 12px; align-items: center; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.pack.off { opacity: .55; }
.pill { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: var(--bg); white-space: nowrap; }
.pill.on { background: var(--ok-soft); color: var(--ok); }

/* Placar */
.board { display: flex; flex-direction: column; gap: 8px; }
.score-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.score-row .name { font-weight: 700; display: flex; gap: 8px; align-items: center; min-width: 0; }
.score-row .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score-row .pts { font-variant-numeric: tabular-nums; font-weight: 700; }
.bar { grid-column: 1 / -1; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--tc, var(--accent)); border-radius: 99px; }

/* Passar o celular */
.handoff { background: var(--surface); border-radius: 24px; padding: 24px 20px; display: flex; flex-direction: column; gap: 14px; text-align: center; border-top: 10px solid var(--tc, var(--accent)); }
.handoff .who { font-family: var(--display); font-weight: 400; font-size: 40px; line-height: 1.05; word-break: break-word; }

/* Carta */
.card { background: var(--surface); border-radius: 24px; padding: 12px; display: flex; flex-direction: column; gap: 10px; border: 1.5px solid var(--line); }
.song { text-align: left; border-radius: 16px; padding: 14px 14px 14px 16px; display: flex; flex-direction: column; gap: 2px; border: 2.5px solid transparent; position: relative; }
.song:nth-child(1) { background: var(--stripe-1); }
.song:nth-child(2) { background: var(--stripe-2); }
.song:nth-child(3) { background: var(--stripe-3); }
.song.desafio { background: var(--accent-soft); }
.song.sel { border-color: var(--accent); }
.song .t { font-weight: 700; font-size: 18px; line-height: 1.2; padding-right: 64px; }
.song .a { font-size: 14px; color: var(--muted); }
.song .l { font-style: italic; font-size: 15px; margin-top: 4px; }
.song .tag { position: absolute; top: 12px; right: 12px; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: var(--surface); }
.song.desafio .tag { background: var(--accent); color: var(--accent-ink); }

/* Cantando */
.stage { background: var(--surface); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; border: 1.5px solid var(--line); transition: background .3s; }
.stage.dance { background: var(--warn-soft); border-color: var(--warn); }
.ring { position: relative; width: 190px; height: 190px; max-width: 100%; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: var(--line); }
.ring .prog { stroke: var(--accent); transition: stroke-dashoffset .25s linear; }
.stage.dance .ring .prog { stroke: var(--warn); }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 64px; font-variant-numeric: tabular-nums; }
.now-song { font-size: 14px; color: var(--muted); }
.now-song b { color: var(--ink); }
.dance-msg { font-weight: 700; }
.marks { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.mark { padding: 6px 12px; border-radius: 99px; background: var(--bg); font-weight: 700; font-size: 14px; }
.mark.ok { background: var(--ok-soft); color: var(--ok); }
.singer-val { font-weight: 700; font-size: 18px; }
.chooser { background: var(--bg); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; width: 100%; box-sizing: border-box; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { padding: 10px 14px; border-radius: 99px; background: var(--surface); border: 1.5px solid var(--line); font-weight: 700; }

/* Resultado e vitória */
.result { background: var(--surface); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 12px; text-align: center; border: 1.5px solid var(--line); }
.big { font-family: var(--display); font-size: 56px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.answer { background: var(--bg); border-radius: 14px; padding: 12px; }
.win { text-align: center; display: flex; flex-direction: column; gap: 12px; padding-block: 12px; }
.win h1 { font-family: var(--display); font-weight: 400; font-size: 44px; line-height: 1.05; color: var(--tc, var(--accent)); word-break: break-word; }
.log { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.log div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.log div span:last-child { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }

/* Tutorial */
.tut { background: var(--surface); border-radius: 24px; padding: 24px 20px; display: flex; flex-direction: column; gap: 14px; border: 1.5px solid var(--line); }
.tut .step { font-weight: 700; color: var(--accent); }
.tut h2 { font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1.05; }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); width: 22px; border-radius: 99px; }

/* Regras */
.sheet-bg { position: fixed; inset: 0; background: rgba(10, 8, 30, .5); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 88%; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; box-sizing: border-box; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-family: var(--display); font-weight: 400; font-size: 24px; flex: 1; }
.sheet-body { overflow-y: auto; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 4px; }
.rule { padding: 12px 14px; border-radius: 14px; scroll-margin-top: 8px; }
.rule h3 { font-size: 17px; margin-bottom: 4px; }
.rule ul { margin: 4px 0 0; padding-left: 20px; }
.rule.here { background: var(--accent-soft); }
.rule.here h3::after { content: "  · você está aqui"; font-size: 12px; color: var(--accent); }

/* Pacotes e Blitz */
.pack-btn { width: 100%; text-align: left; }
.song .pk { font-size: 13px; margin-top: 4px; color: var(--muted); font-weight: 700; }
.chips.left { justify-content: flex-start; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.blitz { display: flex; flex-direction: column; gap: 8px; }
.bt { display: flex; gap: 8px; align-items: stretch; }
.bt-main { flex: 1; min-width: 0; display: flex; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 10px 12px; min-height: 60px; box-sizing: border-box; }
.bt-main i { font-family: var(--display); font-style: normal; font-size: 22px; width: 28px; text-align: center; color: var(--muted); flex: none; }
.bt-main > span:not(.tag) { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.bt-main b { line-height: 1.2; }
.bt-main em { font-style: normal; font-size: 14px; color: var(--muted); }
.bt-main .tag { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: var(--bg); flex: none; }
.bt.ok .bt-main { background: var(--ok-soft); border-color: var(--ok); }
.bt.ok .bt-main i { color: var(--ok); }
.bt-swap { flex: none; padding: 0 12px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); font-weight: 700; font-size: 14px; }
.hideart .bt-main em { visibility: hidden; }
.blitz-stage { flex-direction: row; justify-content: center; gap: 20px; padding: 14px; }
.small-ring { width: 120px; height: 120px; }
.small-ring .num { font-size: 44px; }
.blitz-score { display: flex; flex-direction: column; align-items: flex-start; }
.confirm { background: var(--accent-soft); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

/* ===== Pacotes de músicas =====
   Base fica acima; os outros vêm de catalogo.js (planilha do catálogo).
   Cada música tem um id que não muda: "base:n:12", "base:d:3" ou "<pacote>:<posição>". */
const PACOTES = [
  { id: "base", nome: "Base", desc: "Sucessos com mais de 1 bilhão de plays e clássicos do Brasil" },
  { id: "sertanejo90", nome: "Sertanejo anos 90", desc: "Leandro & Leonardo, Zezé Di Camargo & Luciano, Chitãozinho & Xororó…" },
  { id: "pagode90", nome: "Pagode anos 90", desc: "Art Popular, Raça Negra, Só Pra Contrariar…" },
  { id: "emo2000", nome: "Emo e rock 2000", desc: "NX Zero, Fresno, CPM 22 e o rock dos anos 2000" },
  { id: "mpbrock", nome: "MPB e rock BR", desc: "Roberto Carlos, Legião, Titãs e os clássicos brasileiros" }
];
const CAT = typeof CATALOGO === "object" ? CATALOGO : {};
function musicaPorId(id) {
  const p = String(id).split(":");
  if (p[0] === "base") { const m = PACOTE_BASE[p[1] === "d" ? "desafio" : "normal"][+p[2]]; return m && { t: m[0], a: m[1], l: m[2], fa: p[1] === "d", pk: "base" }; }
  const s = (CAT[p[0]] || [])[+p[1]]; if (!s) return null;
  const [a, t, pop] = s.split("|");
  return { t, a, l: null, fa: pop === "F", pk: p[0] };
}
// Ids dos pacotes escolhidos. tipo "n" = hits (normais da carta), "d" = de fã (Desafio).
function idsDe(packs, tipo) {
  const out = [];
  packs.forEach(pk => {
    if (pk === "base") PACOTE_BASE[tipo === "d" ? "desafio" : "normal"].forEach((_, i) => out.push("base:" + tipo + ":" + i));
    else (CAT[pk] || []).forEach((s, i) => { if (s.endsWith(tipo === "d" ? "|F" : "|H")) out.push(pk + ":" + i); });
  });
  return out;
}
function contarPacote(pk) { return { n: idsDe([pk], "n").length, d: idsDe([pk], "d").length }; }
function nomePacote(pk) { const p = PACOTES.find(x => x.id === pk); return p ? p.nome : ""; }
function pacotesValidos(lista) { const ok = (lista || []).filter(pk => pk === "base" || CAT[pk]); return ok.length ? ok : ["base"]; }

/* ===== Constantes do jogo ===== */
const TEMPO = 40;          // segundos por música
const AVISO = 15;          // apito e coreografia liberada
const META = 50;           // pontos para vencer
const PTS_ARTISTA = 3, PTS_TITULO = 5;
const CORRIDA_INICIO = 8;  // cantor começa valendo 8 e perde 1 a cada 5 s
const CORES = ["coral", "mar", "sol", "uva", "lima", "ceu"];
const NOMES_COR = ["Coral", "Mar", "Sol", "Uva", "Lima", "Céu"];
const MODOS = {
  classico: { nome: "Clássico", desc: "Em times. Quem acerta continua jogando." },
  umavez: { nome: "Uma vez por time", desc: "Em times. A vez sempre passa, para todos jogarem mais. Bom para mais de 15 pessoas." },
  corrida: { nome: "Corrida", desc: "Cada um por si. O cantor canta para todos e quem acertar primeiro pontua." },
  blitz: { nome: "Blitz", desc: "Em times. 10 músicas em 1 minuto: cada música acertada vale 1 ponto. As que já saíram não repetem." }
};
const BLITZ_QTD = 10, BLITZ_TEMPO = 60, BLITZ_RODADAS = 10;
const OPCOES_RODADAS = [3, 5, 10, 15];
function rodadasBlitz(g) { return (g && g.rodadas) || BLITZ_RODADAS; }
const NIVEIS = { mix: "Hits e de fã", hits: "Só hits", fa: "Só de fã" };

/* ===== Armazenamento local (opcional, só neste aparelho) ===== */
const store = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const parseNomes = s => String(s || "").split(/[,\n;]/).map(x => x.trim()).filter(Boolean);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const range = n => Array.from({ length: n }, (_, i) => i);

function setupPadrao() {
  return { mode: "classico", teams: [
    { name: "Time Coral", color: "coral", players: "" },
    { name: "Time Mar", color: "mar", players: "" }
  ], players: "", packs: ["base"], nivel: "mix", rodadas: BLITZ_RODADAS };
}

let S = { screen: "menu", open: "pabla", rules: null, tut: 0, tutNext: null, err: "", choose: null, exitAsk: false, setup: setupPadrao(), game: null };
let ticker = null;

function salvar() { store.set("pabla.setup", S.setup); if (S.game) store.set("pabla.game", S.game); else store.del("pabla.game"); }

/* ===== Som, vibração e tela acesa ===== */
let audio = null;
function initAudio() { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); } catch (e) { audio = null; } }
function beep(freq = 880, dur = 0.18, times = 1) {
  if (!audio) return;
  try {
    for (let i = 0; i < times; i++) {
      const t = audio.currentTime + i * (dur + 0.08);
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = "square"; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + dur + 0.02);
    }
  } catch (e) {}
}
function vibrar(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
let wakeLock = null;
async function telaAcesa() { try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch (e) { wakeLock = null; } }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.game && S.screen !== "menu") telaAcesa(); });

/* ===== Lógica da partida ===== */
// Partidas salvas antes dos pacotes guardavam só a posição no Base.
function idAntigo(id, k) { return typeof id === "number" ? "base:" + k + ":" + id : id; }
function novoBaralho(packs) { return { n: shuffle(idsDe(packs, "n")), d: shuffle(idsDe(packs, "d")) }; }
function puxar(g, k) {
  if (!g.deck[k].length) g.deck[k] = shuffle(idsDe(g.packs || ["base"], k));
  if (!g.deck[k].length) g.deck[k] = shuffle(idsDe(g.packs || ["base"], k === "n" ? "d" : "n"));
  return idAntigo(g.deck[k].pop(), k);
}
function emTimes(g) { return g.mode !== "corrida"; }

/* ===== Blitz: músicas que já saíram (guardadas neste aparelho, valem entre partidas) ===== */
function tocadas() { return store.get("pabla.tocadas") || {}; }
function poolBlitz(packs, nivel, ignorarTocadas) {
  const t = ignorarTocadas ? {} : tocadas();
  const ids = (nivel === "fa" ? [] : idsDe(packs, "n")).concat(nivel === "hits" ? [] : idsDe(packs, "d"));
  return ids.filter(id => !t[id]);
}
function zerarTocadas(packs) {
  const t = tocadas();
  Object.keys(t).forEach(id => { if (packs.includes(id.split(":")[0])) delete t[id]; });
  store.set("pabla.tocadas", t);
}
function sortearBlitz(g) {
  let pool = shuffle(poolBlitz(g.packs, g.nivel));
  g.zerou = false;
  if (pool.length < BLITZ_QTD) { zerarTocadas(g.packs); pool = shuffle(poolBlitz(g.packs, g.nivel)); g.zerou = true; }
  g.card = pool.slice(0, BLITZ_QTD);
  g.ok = g.card.map(() => false);
}
function trocarBlitz(g, i) {
  const usadas = new Set(g.card);
  const p = shuffle(poolBlitz(g.packs, g.nivel).filter(id => !usadas.has(id)));
  if (p.length) g.card[i] = p[0];
}
function acertosBlitz(g) { return (g.ok || []).filter(Boolean).length; }
function fimBlitz(g) { return g.teams.every(t => (t.rounds || 0) >= rodadasBlitz(g)); }
function cantorAtual(g) {
  if (emTimes(g)) { const t = g.teams[g.turn]; return { nome: t.players[t.next % t.players.length], time: t }; }
  return { nome: g.players[g.singer].name, time: null };
}
function mult(g) { return g.pick === 3 ? 2 : 1; }
function valorCantor(g) {
  const passou = Math.floor((Date.now() - g.startedAt) / 5000);
  return Math.max(0, CORRIDA_INICIO - passou) * mult(g);
}

function iniciarPartida() {
  const st = S.setup; S.err = "";
  const packs = pacotesValidos(st.packs);
  const g = { mode: st.mode, packs, nivel: st.nivel || "mix", rodadas: +st.rodadas || BLITZ_RODADAS, turn: 0, singer: 0, deck: novoBaralho(packs), card: null, pick: null, marks: null, log: [], winner: null };
  if (st.mode === "blitz" && !poolBlitz(packs, g.nivel, true).length) { S.err = "Esses pacotes não têm músicas nessa dificuldade. Escolha outra."; return render(); }
  if (st.mode === "corrida") {
    const ps = parseNomes(st.players);
    if (ps.length < 3) { S.err = "No modo Corrida, cadastre pelo menos 3 pessoas."; return render(); }
    g.players = ps.map(n => ({ name: n, score: 0 }));
  } else {
    g.teams = st.teams.map((t, i) => ({ name: t.name.trim() || "Time " + NOMES_COR[i], color: t.color, players: parseNomes(t.players), score: 0, next: 0, rounds: 0 }));
    const fraco = g.teams.find(t => t.players.length < 2);
    if (fraco) { S.err = fraco.name + " precisa de pelo menos 2 pessoas: uma canta e as outras adivinham."; return render(); }
  }
  S.game = g; salvar(); initAudio(); telaAcesa();
  if (!store.get("pabla.tutorialVisto")) { S.tut = 0; S.tutNext = "handoff"; S.screen = "tutorial"; }
  else S.screen = "handoff";
  render();
}

function verCarta() {
  const g = S.game;
  if (g.mode === "blitz") { if (!g.card) sortearBlitz(g); }
  else if (!g.card) g.card = [puxar(g, "n"), puxar(g, "n"), puxar(g, "n"), puxar(g, "d")];
  g.pick = null; S.screen = "card"; salvar(); render();
}
function musica(g, i) { return musicaPorId(idAntigo(g.card[i], i === 3 ? "d" : "n")) || { t: "?", a: "", l: null }; }

function comecar() {
  const g = S.game;
  if (g.mode === "blitz") return comecarBlitz();
  if (g.pick == null) return;
  initAudio(); telaAcesa();
  g.marks = { artist: null, title: null, falou: false, singerPts: 0, fim: null };
  g.startedAt = Date.now(); g.endsAt = g.startedAt + TEMPO * 1000; g.warned = false;
  S.choose = null; S.screen = "sing"; salvar(); render();
  beep(660, 0.12, 2); iniciarRelogio();
}

function iniciarRelogio() {
  pararRelogio();
  ticker = setInterval(tick, 200); tick();
}
function pararRelogio() { if (ticker) { clearInterval(ticker); ticker = null; } }
function comecarBlitz() {
  const g = S.game; initAudio(); telaAcesa();
  const t = tocadas(); g.card.forEach(id => { t[id] = true; }); store.set("pabla.tocadas", t);
  g.marks = { fim: null }; g.pausado = null;
  g.startedAt = Date.now(); g.endsAt = g.startedAt + BLITZ_TEMPO * 1000; g.lastBeep = null;
  S.screen = "sing"; salvar(); render();
  beep(880, 0.2); iniciarRelogio();
}
function restanteBlitz(g) { return g.pausado != null ? g.pausado : Math.max(0, g.endsAt - Date.now()); }
function pausarBlitz() {
  const g = S.game;
  if (g.pausado == null) { g.pausado = Math.max(0, g.endsAt - Date.now()); pararRelogio(); }
  else { g.endsAt = Date.now() + g.pausado; g.pausado = null; iniciarRelogio(); }
  salvar(); render();
}
function tickBlitz(g) {
  const rest = restanteBlitz(g), s = Math.ceil(rest / 1000);
  const num = document.getElementById("timer-num"), prog = document.getElementById("timer-prog"), stage = document.getElementById("stage");
  if (num) num.textContent = s;
  if (prog) { const c = 2 * Math.PI * 84; prog.style.strokeDasharray = c; prog.style.strokeDashoffset = c * (1 - rest / (BLITZ_TEMPO * 1000)); }
  if (stage) stage.classList.toggle("dance", rest <= 10000);
  if (g.pausado == null && s <= 5 && s > 0 && g.lastBeep !== s) { g.lastBeep = s; beep(660, 0.1); }
  if (g.pausado == null && rest <= 0) { beep(220, 0.6); vibrar(400); terminar("tempo"); }
}
function tick() {
  const g = S.game; if (!g || S.screen !== "sing") return pararRelogio();
  if (g.mode === "blitz") return tickBlitz(g);
  const rest = Math.max(0, g.endsAt - Date.now());
  const s = Math.ceil(rest / 1000);
  const num = document.getElementById("timer-num"), prog = document.getElementById("timer-prog"), stage = document.getElementById("stage");
  if (num) num.textContent = s;
  if (prog) { const c = 2 * Math.PI * 84; prog.style.strokeDasharray = c; prog.style.strokeDashoffset = c * (1 - rest / (TEMPO * 1000)); }
  if (rest <= AVISO * 1000 && !g.warned) { g.warned = true; beep(988, 0.2, 2); vibrar([200, 100, 200]); salvar(); }
  if (stage) stage.classList.toggle("dance", rest <= AVISO * 1000);
  const dm = document.getElementById("dance-msg"); if (dm) dm.hidden = rest > AVISO * 1000;
  const sv = document.getElementById("singer-val"); if (sv) sv.textContent = valorCantor(g);
  if (rest <= 0) { beep(220, 0.5, 1); vibrar(400); terminar("tempo"); }
}

function marcar(tipo, quem) {
  const g = S.game, m = g.marks;
  if (tipo === "artist") m.artist = quem || true;
  if (tipo === "title") { m.title = quem || true; if (!emTimes(g)) m.singerPts = valorCantor(g); }
  S.choose = null;
  // O tempo continua correndo até acertarem os dois ou o tempo acabar.
  if (m.artist && m.title) { beep(1320, 0.1, 2); terminar("ambos"); return; }
  beep(1200, 0.08); salvar(); render();
}
function terminar(motivo) {
  pararRelogio(); const g = S.game; g.marks.fim = motivo; S.choose = null; S.screen = "result"; salvar(); render();
}

function pontosDaMusica(g) {
  const m = g.marks, x = mult(g);
  if (m.falou) return { total: 0, itens: [] };
  const itens = [];
  if (m.artist) itens.push({ quem: m.artist === true ? null : m.artist, o: "Artista", p: PTS_ARTISTA * x });
  if (m.title) itens.push({ quem: m.title === true ? null : m.title, o: "Título", p: PTS_TITULO * x });
  if (!emTimes(g) && m.singerPts) itens.push({ quem: cantorAtual(g).nome, o: "Cantor", p: m.singerPts });
  return { total: itens.reduce((a, b) => a + b.p, 0), itens };
}

function avancar() {
  const g = S.game, cantor = cantorAtual(g);
  if (g.mode === "blitz") {
    const t = g.teams[g.turn], n = acertosBlitz(g);
    t.score += n; t.next++; t.rounds = (t.rounds || 0) + 1;
    g.log.unshift({ txt: cantor.nome + " (" + t.name + "): Blitz " + n + "/" + g.card.length, p: n });
    g.turn = (g.turn + 1) % g.teams.length;
    if (fimBlitz(g)) {
      const max = Math.max(...g.teams.map(x => x.score)), lideres = g.teams.map((x, i) => x.score === max ? i : -1).filter(i => i >= 0);
      g.winner = lideres.length === 1 ? lideres[0] : -1; g.empate = lideres;
    }
    g.card = null; g.ok = null; g.marks = null; g.pausado = null;
    S.hideArt = false; S.screen = g.winner != null ? "win" : "handoff";
    salvar(); render(); return;
  }
  const pts = pontosDaMusica(g), m = g.marks, song = musica(g, g.pick);
  if (emTimes(g)) {
    const t = g.teams[g.turn];
    t.score += pts.total;
    g.log.unshift({ txt: cantor.nome + " (" + t.name + "): " + song.t, p: pts.total });
    t.next++;
    if (t.score >= META) { g.winner = g.turn; }
    const acertou = (m.artist || m.title) && !m.falou;
    if (!(g.mode === "classico" && acertou)) g.turn = (g.turn + 1) % g.teams.length;
  } else {
    pts.itens.forEach(it => { const p = g.players.find(x => x.name === it.quem); if (p) p.score += it.p; });
    g.log.unshift({ txt: cantor.nome + " cantou " + song.t, p: pts.total });
    const lider = g.players.reduce((a, b, i) => (b.score > g.players[a].score ? i : a), 0);
    if (g.players[lider].score >= META) g.winner = lider;
    g.singer = (g.singer + 1) % g.players.length;
  }
  g.card = null; g.pick = null; g.marks = null;
  S.screen = g.winner != null ? "win" : "handoff";
  salvar(); render();
}

    '<div class="dots">' + TUTORIAL.map((_, i) => '<i class="' + (i === S.tut ? "on" : "") + '"></i>').join("") + '</div></div>' +
    '<div class="row">' + (S.tut > 0 ? '<button class="btn btn-ghost" data-act="tut-prev">Voltar</button>' : '<button class="btn btn-ghost" data-act="tut-fim">Pular</button>') +
    '<button class="btn btn-primary" data-act="' + (ultimo ? "tut-fim" : "tut-next") + '">' + (ultimo ? "Entendi" : "Próximo") + '</button></div>';
}

function telaHandoff() {
  const g = S.game, c = cantorAtual(g);
  const tc = c.time ? "var(--t-" + c.time.color + ")" : "var(--accent)";
  const sub = c.time ? esc(c.time.name) : "Cada um por si";
  return topbar("Pabla") +
    dica("<b>Passe o celular.</b> Ninguém além de " + esc(c.nome) + " deve olhar a tela agora.") +

    '<button class="btn btn-primary" data-act="ver-carta">Sou ' + esc(c.nome) + ': ver ' + (g.mode === "blitz" ? "as músicas" : "a carta") + '</button></div>' +
    '<div class="section"><div class="label">Placar · ' + (g.mode === "blitz" ? rodadasBlitz(g) + " rodadas por time" : "meta " + META) + '</div>' + placar(g) + '</div>' +
    (g.log.length ? '<div class="section"><div class="label">Anotações</div><div class="log">' + g.log.slice(0, 6).map(l => '<div><span>' + esc(l.txt) + '</span><span>+' + l.p + '</span></div>').join("") + '</div></div>' : "");

function listaBlitz(g, jogando) {
  return '<div class="blitz' + (S.hideArt ? " hideart" : "") + '">' + g.card.map((id, i) => {
    const m = musicaPorId(id) || { t: "?", a: "" }, ok = g.ok[i];
    return '<div class="bt' + (ok ? " ok" : "") + '">' +
      (jogando
        ? '<button class="bt-main" data-act="blitz-ok" data-i="' + i + '" aria-pressed="' + ok + '"' + (g.pausado != null ? " disabled" : "") + '>'
        : '<div class="bt-main">') +
      '<i>' + (ok ? "✓" : i + 1) + '</i><span><b>' + esc(m.t) + '</b><em>' + esc(m.a) + '</em></span><span class="tag">' + (m.fa ? "Fã" : "Hit") + '</span>' +
      (jogando ? '</button>' : '</div>') +
      (!jogando && !g.marks ? '<button class="bt-swap" data-act="blitz-trocar" data-i="' + i + '" aria-label="Trocar ' + esc(m.t) + '">Trocar</button>' : "") +
    '</div>';

}
function telaCartaBlitz() {

  return topbar("Pabla · Blitz") +
    dica("<b>" + esc(c.nome) + ", essas são as suas " + g.card.length + " músicas.</b> Dá para trocar alguma antes de começar. Depois é cantarolar uma atrás da outra, na ordem que quiser.") +
    (g.zerou ? '<div class="notice"><span class="small">As músicas inéditas desses pacotes acabaram, então as que já tocaram voltaram para o sorteio.</span></div>' : "") +
    listaBlitz(g, false) +
    '<button class="btn btn-ghost" data-act="blitz-artistas">' + (S.hideArt ? "Mostrar artistas" : "Esconder artistas") + '</button>' +
    '<button class="btn btn-primary" data-act="comecar">Valendo! · ' + BLITZ_TEMPO + ' s</button>';
}
function telaCantarBlitz() {
  const g = S.game, c = 2 * Math.PI * 84, pausado = g.pausado != null;
  return topbar("Pabla · Blitz") +
    dica(pausado ? "<b>Pausado.</b> Toque em Continuar para voltar ao relógio." : "<b>Cantarole!</b> Toque na música quando o time acertar o título. Errou ou travou, pule para outra.") +
    '<div class="stage blitz-stage" id="stage">' +
      '<div class="ring small-ring"><svg viewBox="0 0 190 190"><circle class="track" cx="95" cy="95" r="84" fill="none" stroke-width="14"/><circle class="prog" id="timer-prog" cx="95" cy="95" r="84" fill="none" stroke-width="14" stroke-linecap="round" style="stroke-dasharray:' + c + ';stroke-dashoffset:0"/></svg><div class="num" id="timer-num">' + Math.ceil(restanteBlitz(g) / 1000) + '</div></div>' +
      '<div class="blitz-score"><span class="big">' + acertosBlitz(g) + '</span><span class="muted">/ ' + g.card.length + ' acertos</span></div>' +
    '</div>' +
    listaBlitz(g, true) +
    '<div class="row"><button class="btn btn-ghost" data-act="blitz-pausar">' + (pausado ? "Continuar" : "Pausar") + '</button><button class="btn btn-ghost" data-act="desistir">Encerrar rodada</button></div>' +
    '<button class="btn btn-ghost" data-act="blitz-artistas">' + (S.hideArt ? "Mostrar artistas" : "Esconder artistas") + '</button>';
}
function telaResultadoBlitz() {
  const g = S.game, n = acertosBlitz(g), t = g.teams[g.turn];
  const prox = g.teams[(g.turn + 1) % g.teams.length];
  const ultima = g.teams.every((x, i) => (x.rounds || 0) + (i === g.turn ? 1 : 0) >= rodadasBlitz(g));
  return topbar("Pabla · Blitz") + dica("<b>Fim da rodada.</b> Confiram as músicas. Dá para corrigir um acerto tocando nele.") +
    '<div class="result"><div class="label">' + (g.marks.fim === "tempo" ? "Acabou o tempo" : "Rodada encerrada") + ' · ' + esc(t.name) + '</div><div class="big">+' + n + '</div>' +
    '<p class="small muted">' + (ultima ? "Era a última rodada. Vamos ver quem venceu." : "Agora é a vez de " + esc(prox.name) + ".") + '</p></div>' +
    '<div class="blitz">' + g.card.map((id, i) => { const m = musicaPorId(id) || { t: "?", a: "" };
      return '<div class="bt' + (g.ok[i] ? " ok" : "") + '"><button class="bt-main" data-act="blitz-ok" data-i="' + i + '" aria-pressed="' + g.ok[i] + '"><i>' + (g.ok[i] ? "✓" : i + 1) + '</i><span><b>' + esc(m.t) + '</b><em>' + esc(m.a) + '</em></span></button></div>'; }).join("") + '</div>' +
    '<button class="btn btn-primary" data-act="avancar">Continuar</button>';

function telaCarta() {
  const g = S.game, c = cantorAtual(g);
  if (g.mode === "blitz") return telaCartaBlitz();
  return topbar("Pabla") +
    dica("<b>" + esc(c.nome) + ", escolha uma música.</b> Lembre a melodia e toque em Começar.") +
    '<div class="card">' + [0, 1, 2, 3].map(i => {
      const m = musica(g, i);
      return '<button class="song' + (i === 3 ? " desafio" : "") + (g.pick === i ? " sel" : "") + '" data-act="pick" data-i="' + i + '" aria-pressed="' + (g.pick === i) + '">' +
        '<span class="tag">' + (i === 3 ? "Desafio ×2" : (PTS_ARTISTA + PTS_TITULO) + " pts") + '</span>' +
        '<span class="t">' + esc(m.t) + '</span><span class="a">' + esc(m.a) + '</span>' + (m.l ? '<span class="l">“' + esc(m.l) + '”</span>' : '<span class="pk">' + esc(nomePacote(m.pk)) + '</span>') + '</button>';
    }).join("") + '</div>' +
    '<button class="btn btn-primary" data-act="comecar"' + (g.pick == null ? " disabled" : "") + '>Começar · ' + TEMPO + ' s</button>';
}

function telaCantar() {
  if (S.game.mode === "blitz") return telaCantarBlitz();
  const g = S.game, m = g.marks, song = musica(g, g.pick), x = mult(g);
  const c = 2 * Math.PI * 84;
  let chooser = "";
  if (!emTimes(g) && S.choose) {
    const cantor = cantorAtual(g).nome;
    chooser = '<div class="chooser"><b>Quem acertou o ' + (S.choose === "artist" ? "artista" : "título") + '?</b><div class="chips">' +
      g.players.filter(p => p.name !== cantor).map(p => '<button class="chip" data-act="quem" data-v="' + esc(p.name) + '">' + esc(p.name) + '</button>').join("") +
      '</div><button class="btn btn-ghost" data-act="quem-cancelar">Cancelar</button></div>';
  }
  const quemTxt = v => (v && v !== true ? " · " + esc(v) : "");
  return topbar("Pabla") +
    dica(emTimes(g) ? "<b>Cantarole!</b> O time grita palpites. Toque em cada acerto; o tempo só para quando acertarem artista e título." : "<b>Cantarole para todos!</b> Quando alguém acertar, toque no botão e escolha quem foi.") +
    '<div class="stage" id="stage"><div class="now-song">Cantando <b>' + esc(song.t) + '</b> · ' + esc(song.a) + (x > 1 ? " · Desafio ×2" : "") + '</div>' +
      '<div class="ring"><svg viewBox="0 0 190 190"><circle class="track" cx="95" cy="95" r="84" fill="none" stroke-width="14"/><circle class="prog" id="timer-prog" cx="95" cy="95" r="84" fill="none" stroke-width="14" stroke-linecap="round" style="stroke-dasharray:' + c + ';stroke-dashoffset:0"/></svg><div class="num" id="timer-num">' + TEMPO + '</div></div>' +
      '<div class="dance-msg" id="dance-msg" hidden>Últimos ' + AVISO + ' s: coreografia liberada!</div>' +
      (!emTimes(g) ? '<div class="singer-val">Cantor vale agora: <span id="singer-val">' + valorCantor(g) + '</span></div>' : "") +
      '<div class="marks"><span class="mark' + (m.artist ? " ok" : "") + '">Artista' + (m.artist ? " ✓" + quemTxt(m.artist) : "") + '</span><span class="mark' + (m.title ? " ok" : "") + '">Título' + (m.title ? " ✓" + quemTxt(m.title) : "") + '</span></div>' +
      chooser +
    '</div>' +
    (S.choose ? "" :
    '<div class="stack">' +
      (!m.title ? '<button class="btn btn-ok" data-act="acertou-titulo">Acertaram o título · +' + PTS_TITULO * x + '</button>' : "") +
      (!m.artist ? '<button class="btn ' + (m.title ? "btn-ok" : "btn-ghost") + '" data-act="acertou-artista">Acertaram o artista · +' + PTS_ARTISTA * x + '</button>' : "") +
      '<div class="row"><button class="btn btn-warn" data-act="falou">Falou ou apontou</button><button class="btn btn-ghost" data-act="desistir">' + (m.artist || m.title ? "Encerrar" : "Desistir") + '</button></div>' +
    '</div>');
}

function telaResultado() {
  if (S.game.mode === "blitz") return telaResultadoBlitz();
  const g = S.game, m = g.marks, song = musica(g, g.pick), pts = pontosDaMusica(g), x = mult(g);
  const titulo = m.falou ? "Falou! Zero pontos." : m.title && m.artist ? "Acertaram tudo!" : m.title ? "Acertaram o título" : m.artist ? "Acertaram o artista" : "Acabou o tempo";
  const extra = emTimes(g) && m.title && !m.artist && !m.falou ? '<button class="btn btn-ghost" data-act="tambem-artista">Também disseram o artista · +' + PTS_ARTISTA * x + '</button>' : "";
  const extraCorrida = !emTimes(g) && m.title && !m.artist && !m.falou ? '<button class="btn btn-ghost" data-act="escolher-artista">Alguém disse o artista? · +' + PTS_ARTISTA * x + '</button>' : "";
  let proximo = "";
  if (emTimes(g)) {
    const acertou = (m.artist || m.title) && !m.falou;
    const t = g.teams[g.turn];
    proximo = g.mode === "classico" && acertou ? t.name + " continua jogando." : "A vez passa para " + g.teams[(g.turn + 1) % g.teams.length].name + ".";
    if (t.score + pts.total >= META) proximo = t.name + " chega a " + META + "!";
  }
  let chooser = "";
  if (!emTimes(g) && S.choose === "artist-late") {
    chooser = '<div class="chooser"><b>Quem disse o artista?</b><div class="chips">' + g.players.filter(p => p.name !== cantorAtual(g).nome).map(p => '<button class="chip" data-act="quem-late" data-v="' + esc(p.name) + '">' + esc(p.name) + '</button>').join("") + '</div></div>';
  }
  return topbar("Pabla") + dica("<b>Resultado.</b> Confiram a resposta e passem para a próxima vez.") +
    '<div class="result"><div class="label">' + titulo + '</div><div class="big">+' + pts.total + '</div>' +
      '<div class="answer"><div class="label">A música era</div><b>' + esc(song.t) + '</b><div class="small muted">' + esc(song.a) + '</div></div>' +
      (!emTimes(g) && pts.itens.length ? '<div class="log">' + pts.itens.map(i => '<div><span>' + esc(i.quem || "") + ' · ' + i.o + '</span><span>+' + i.p + '</span></div>').join("") + '</div>' : "") +
      (proximo ? '<p class="small muted">' + esc(proximo) + '</p>' : "") +
    '</div>' + extra + extraCorrida + chooser +
    '<button class="btn btn-primary" data-act="avancar">Continuar</button>';
}

function telaVitoria() {
  const g = S.game;
  const empate = g.winner === -1;
  const nome = empate ? (g.empate || []).map(i => g.teams[i].name).join(" e ") : emTimes(g) ? g.teams[g.winner].name : g.players[g.winner].name;
  const tc = !empate && emTimes(g) ? "var(--t-" + g.teams[g.winner].color + ")" : "var(--accent)";
  const sub = g.mode === "blitz" ? rodadasBlitz(g) + " rodadas de Blitz" : META + " pontos";
  return topbar("Pabla") +
    '<div class="win" style="--tc:' + tc + '"><div class="label">Fim de jogo · ' + sub + '</div><h1>' + (empate ? "Empate! " + esc(nome) : esc(nome) + " venceu!") + '</h1></div>' +
    '<div class="section"><div class="label">Placar final</div>' + placar(g, true) + '</div>' +
    '<div class="section"><div class="label">Todas as músicas</div><div class="log">' + g.log.map(l => '<div><span>' + esc(l.txt) + '</span><span>+' + l.p + '</span></div>').join("") + '</div></div>' +
    '<div class="row"><button class="btn btn-ghost" data-act="menu">Menu</button><button class="btn btn-primary" data-act="revanche">Jogar de novo</button></div>';
}

function folhaRegras() {
  if (!S.rules) return "";
  return '<div class="sheet-bg" data-act="regras-fechar"><div class="sheet" role="dialog" aria-modal="true" aria-label="Regras do Pabla" data-stop="1">' +
    '<div class="sheet-head"><h2>Regras do Pabla</h2><button class="icon-btn" data-act="regras-fechar" aria-label="Fechar">×</button></div>' +
    '<div class="sheet-body" id="rules-body">' + REGRAS.map(([id, t, h]) => '<div class="rule' + (id === S.rules ? " here" : "") + '" id="r-' + id + '"><h3>' + t + '</h3>' + h + '</div>').join("") + '</div></div></div>';
}

function render() {
  store.set("pabla.screen", S.screen);
  const telas = { menu: telaMenu, setup: telaSetup, tutorial: telaTutorial, handoff: telaHandoff, card: telaCarta, sing: telaCantar, result: telaResultado, win: telaVitoria };
  document.getElementById("app").innerHTML = (telas[S.screen] || telaMenu)() + folhaRegras();
  if (S.rules) { const el = document.getElementById("r-" + S.rules); if (el) el.scrollIntoView({ block: "start" }); }
  if (S.screen === "sing") tick();
}

/* ===== Eventos ===== */
document.getElementById("app").addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.classList.contains("sheet-bg") && e.target.closest("[data-stop]")) return;
  const a = el.dataset.act, g = S.game;
  switch (a) {
    case "toggle": S.open = S.open === el.dataset.v ? null : el.dataset.v; break;
    case "preparar": S.err = ""; S.screen = "setup"; break;
    case "tutorial": S.tut = 0; S.tutNext = "menu"; S.screen = "tutorial"; break;
    case "tut-next": S.tut++; break;
    case "tut-prev": S.tut--; break;
    case "tut-fim": store.set("pabla.tutorialVisto", true); S.screen = S.tutNext || "menu"; break;
    case "continuar": S.screen = g.marks && g.marks.fim ? "result" : g.card ? "card" : "handoff"; telaAcesa(); break;
    case "descartar": S.game = null; salvar(); S.err = ""; S.screen = "setup"; break;
    case "regras": S.rules = secaoAtual(); break;
    case "regras-fechar": S.rules = null; break;
    case "sair": S.restartAsk = false;
      if (S.screen === "win") { S.game = null; salvar(); S.screen = "menu"; }
      else if (S.screen === "setup" || S.screen === "tutorial") S.screen = "menu";
      else if (S.screen === "sing") { terminar("desistiu"); return; }
      else S.exitAsk = true;
      break;
    case "sair-nao": S.exitAsk = false; break;
    case "recomecar": S.restartAsk = true; S.exitAsk = false; break;
    case "recomecar-nao": S.restartAsk = false; break;
    case "recomecar-sim": S.restartAsk = false; pararRelogio(); S.game = null; iniciarPartida(); return;
    case "nova-partida": S.exitAsk = false; pararRelogio(); S.game = null; salvar(); S.err = ""; S.screen = "setup"; break;
    case "sair-sim": S.exitAsk = false; pararRelogio(); S.screen = "menu"; break;
    case "menu": S.game = null; salvar(); S.screen = "menu"; break;
    case "modo": S.setup.mode = el.dataset.v; S.err = ""; S.zerarAsk = false; salvar(); break;
    case "pacote": { const v = el.dataset.v, ps = pacotesValidos(S.setup.packs).slice(), i = ps.indexOf(v);
      if (i >= 0) { if (ps.length > 1) ps.splice(i, 1); else S.err = "Deixe pelo menos um pacote ativo."; } else { ps.push(v); S.err = ""; }
      S.setup.packs = ps; salvar(); break; }
    case "rodadas": S.setup.rodadas = +el.dataset.v; salvar(); break;
    case "nivel": S.setup.nivel = el.dataset.v; S.err = ""; salvar(); break;
    case "zerar": S.zerarAsk = true; break;
    case "zerar-nao": S.zerarAsk = false; break;
    case "zerar-sim": S.zerarAsk = false; zerarTocadas(pacotesValidos(S.setup.packs)); break;
    case "blitz-trocar": trocarBlitz(g, +el.dataset.i); salvar(); break;
    case "blitz-ok": { const i = +el.dataset.i; g.ok[i] = !g.ok[i]; if (g.ok[i] && S.screen === "sing") { beep(1200, 0.08); vibrar(40); } salvar(); break; }
    case "blitz-pausar": pausarBlitz(); return;
    case "blitz-artistas": S.hideArt = !S.hideArt; break;
    case "add-team": { const usadas = S.setup.teams.map(t => t.color); const i = CORES.findIndex(c => !usadas.includes(c)); S.setup.teams.push({ name: "Time " + NOMES_COR[i], color: CORES[i], players: "" }); salvar(); break; }
    case "rm-team": S.setup.teams.splice(+el.dataset.i, 1); salvar(); break;
    case "iniciar": iniciarPartida(); return;
    case "ver-carta": verCarta(); return;
    case "pick": g.pick = +el.dataset.i; salvar(); break;
    case "comecar": comecar(); return;
    case "acertou-titulo": if (emTimes(g)) marcar("title"); else { S.choose = "title"; render(); } return;
    case "acertou-artista": if (emTimes(g)) marcar("artist"); else { S.choose = "artist"; render(); } return;
    case "quem": marcar(S.choose, el.dataset.v); return;
    case "quem-cancelar": S.choose = null; break;
    case "falou": g.marks.falou = true; beep(200, 0.3); terminar("falou"); return;
    case "desistir": terminar("desistiu"); return;
    case "tambem-artista": g.marks.artist = true; salvar(); break;
    case "escolher-artista": S.choose = "artist-late"; break;
    case "quem-late": g.marks.artist = el.dataset.v; S.choose = null; salvar(); break;
    case "avancar": S.choose = null; avancar(); return;
    case "revanche": { S.game = null; iniciarPartida(); return; }
  }
  render();
});
document.getElementById("app").addEventListener("input", e => {
  const el = e.target, f = el.dataset.field; if (!f) return;
  if (el.dataset.team != null) S.setup.teams[+el.dataset.team][f] = el.value; else S.setup[f] = el.value;
  salvar();
  if (S.screen === "setup" && f === "players") {
    // Atualiza só a sugestão de modo para não perder o foco do campo
    const st = S.setup, total = st.mode === "corrida" ? parseNomes(st.players).length : st.teams.reduce((a, t) => a + parseNomes(t.players).length, 0);
    const tem = !!document.querySelector(".notice");
    if ((st.mode === "classico" && total > 15) !== tem) { const pos = el.selectionStart, id = el.id; render(); const n = document.getElementById(id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} } }
  }
});

/* ===== Início ===== */
// Ao abrir ou atualizar a página, volta exatamente para onde a partida estava.
function boot(data) {
  S.setup = (data && data.setup) || store.get("pabla.setup") || setupPadrao();
  S.game = (data && data.game) || store.get("pabla.game") || null;
  let tela = (data && data.screen) || store.get("pabla.screen") || "menu";
  const g = S.game;
  const emPartida = ["handoff", "card", "sing", "result", "win"];
  if (emPartida.includes(tela) && !g) tela = "menu";
  if (tela === "card" && !(g && g.card)) tela = "handoff";
  if (tela === "sing" && !(g && g.marks && g.endsAt)) tela = g && g.card ? "card" : "handoff";
  if (tela === "card" && g && g.mode === "blitz" && g.marks) tela = g.marks.fim ? "result" : "sing";
  if (tela === "result" && !(g && g.marks && g.marks.fim)) tela = "handoff";
  if (tela === "win" && !(g && g.winner != null)) tela = "handoff";
  if (tela === "tutorial") tela = g && g.winner == null ? "handoff" : "menu";
  S.screen = tela;
  render();
  if (S.screen === "sing") {
    if (S.game.mode === "blitz" && S.game.pausado != null) { /* pausado: espera o Continuar */ }
    else if (Date.now() >= S.game.endsAt) terminar("tempo");
    else { initAudio(); iniciarRelogio(); }
  }
  if (S.game && emPartida.includes(S.screen)) telaAcesa();
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ setup: S.setup, game: S.game, screen: S.screen })); } catch (e) {}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
else boot(window.claude && window.claude.hot && window.claude.hot.data || {});
